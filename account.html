<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akun — Atandra Textile</title><link rel="stylesheet" href="/store.css"></head><body><header class="store-header"><div class="store-wrap store-nav"><a class="store-brand" href="/">ATANDRA <small>TEXTILE SUPPLY</small></a><nav class="store-links"><a href="/katalog">Belanja Kain</a><a href="/akun/pesanan">Pesanan</a></nav><a class="store-cart" href="/keranjang">Keranjang</a></div></header><main class="store-wrap account-page"><div id="account-auth" class="form-panel"><div class="eyebrow">Customer account</div><h1>Masuk ke akun.</h1><p id="account-message" class="notice" hidden></p><div class="field-grid"><div class="field"><label>Email</label><input id="account-email" type="email"></div><div class="field"><label>Password</label><input id="account-password" type="password"></div><div class="field"><label>Nama saat register</label><input id="account-name"></div><div class="field"><label>Perusahaan</label><input id="account-company"></div></div><button class="primary-btn" id="account-login">Login</button><button class="shop-btn" id="account-register">Buat akun</button></div><div id="account-content" hidden><div class="account-heading"><div><div class="eyebrow">Customer account</div><h1 id="account-title">Akun saya</h1></div><button class="shop-btn" id="account-logout">Logout</button></div><div class="account-grid"><section class="form-panel"><h2>Profil</h2><form id="profile-form"><div class="field"><label>Nama</label><input name="name" required></div><div class="field"><label>WhatsApp</label><input name="phone"></div><div class="field"><label>Perusahaan</label><input name="company_name"></div><button class="primary-btn">Simpan profil</button></form></section><section class="form-panel"><h2>Alamat baru</h2><form id="address-form"><div class="field-grid"><div class="field"><label>Nama penerima</label><input name="full_name" required></div><div
